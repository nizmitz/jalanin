server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    gzip on; gzip_types text/css application/javascript application/json application/manifest+json application/geo+json;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }

    location = /jakarta.pmtiles {
        include /etc/nginx/security-headers.conf;
        gzip off;
        types { } default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Accept-Ranges bytes always;
    }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /basemap-assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # These two locations set their own add_header, which (per nginx inheritance rules) stops
    # the security headers above from being inherited here -- re-include the shared file so the
    # SPA shell and the service worker still get CSP/nosniff/etc.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
