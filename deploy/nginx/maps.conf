# Copy to /opt/ghost/nginx/conf/maps.conf, then: docker compose -f /opt/ghost/docker-compose.yml exec nginx nginx -t && ... nginx -s reload
# Also add `maps.nizmitz.com` to the port-80 redirect server_name list in default.conf.
limit_req_zone $binary_remote_addr zone=maps:2m rate=20r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name maps.nizmitz.com;
    ssl_certificate /etc/letsencrypt/live/nizmitz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nizmitz.com/privkey.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MapLibre fires dozens of Range requests per pan while panning/zooming over the PMTiles
    # file -- rate-limiting those the same as ordinary page traffic causes spurious 429s, so
    # this location is exempt from limit_req (everything else on the host stays limited below).
    location = /jakarta.pmtiles {
        # $upstream_maps is a hardcoded literal (the compose service name), not derived from any
        # client-controlled input -- there is nothing here for an attacker to redirect.
        set $upstream_maps gage-jakarta;
        proxy_pass http://$upstream_maps:8080; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host,generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=maps burst=40 nodelay;
        # $upstream_maps is a hardcoded literal (the compose service name), not derived from any
        # client-controlled input -- there is nothing here for an attacker to redirect.
        set $upstream_maps gage-jakarta;
        proxy_pass http://$upstream_maps:8080; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host,generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        # Forwarding the original Host header downstream is standard reverse-proxy practice; it
        # is not used to choose the proxy destination (see $upstream_maps above), and this server
        # block is already restricted to server_name maps.nizmitz.com.
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
