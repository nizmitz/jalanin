# Shared security headers. Included explicitly (not placed in conf.d/, which nginx
# auto-includes at the http level) by the server block AND by every location that sets its
# own add_header -- nginx only inherits add_header from a parent block when the child block
# defines none of its own, so each such location must include this file again.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
