name: pmtiles
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install go-pmtiles v1.31.2
        run: |
          set -euo pipefail
          curl -sSfL -o pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          # go-pmtiles does not publish a checksums file for this release; pin the sha256 of the
          # known-good asset directly (verified 2026-09-21 via `sha256sum` on the downloaded file).
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  pmtiles.tar.gz" | sha256sum -c -
          tar -xzf pmtiles.tar.gz pmtiles
          sudo install pmtiles /usr/local/bin/pmtiles
          rm -f pmtiles.tar.gz pmtiles
      - run: bash scripts/build-pmtiles.sh
      - run: |
          bash scripts/fetch-basemap-assets.sh
          tar -czf basemap-assets.tar.gz -C public basemap-assets
      - name: Publish to basemap-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          gh release create basemap-latest --notes "rolling basemap" --repo "${{ github.repository }}" || true
          gh release upload basemap-latest public/jakarta.pmtiles basemap-assets.tar.gz --clobber --repo "${{ github.repository }}"
